<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BBM 414 WebGL2 Engine</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #333;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #ui-container {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-family: sans-serif;
        pointer-events: none;
        width: 100%;
      }
      .view-label {
        position: absolute;
        top: 10px;
        font-weight: bold;
        background: rgba(0, 0, 0, 0.7);
        padding: 5px 10px;
        border-radius: 4px;
        pointer-events: auto;
      }
      #label-engine {
        left: 10px;
        color: #00ffcc;
      }
      #label-game {
        left: 51vw;
        color: #ffcc00;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.21"></script>
    <script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.4/gl-matrix-min.min.js"></script>
  </head>
  <body>
    <div id="ui-container">
      <div id="label-engine" class="view-label">VIEW 1 (Engine)</div>
      <div id="label-game" class="view-label">VIEW 2 (Game)</div>
      <p style="margin-top: 50px; margin-left: 10px">
        FPS: <span id="fps">0</span>
        Shader: <span id="shader-name" style="color: #00ff00;">Phong</span><br>
      </p>
    </div>
    <canvas id="glCanvas"></canvas>

    <script src="webgl-utils.js"></script>
    <script src="mesh.js"></script>
    <script src="primitives.js"></script>
    <script src="obj-loader.js"></script>
    <script src="texture.js"></script>
    <script src="main.js"></script>
  </body>
</html>
