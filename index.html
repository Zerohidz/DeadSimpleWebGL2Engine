<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BBM 414 WebGL2 Engine</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #333;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #ui-container {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-family: sans-serif;
        pointer-events: none;
        width: 100%;
      }
      .view-label {
        position: absolute;
        top: 10px;
        font-weight: bold;
        background: rgba(0, 0, 0, 0.7);
        padding: 5px 10px;
        border-radius: 4px;
        pointer-events: auto;
      }
      #label-engine {
        left: 10px;
        color: #00ffcc;
      }
      #label-game {
        left: 51vw;
        color: #ffcc00;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.21"></script>
    <script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.4/gl-matrix-min.min.js"></script>
  </head>
  <body>
    <div id="ui-container">
      <div id="label-engine" class="view-label">VIEW 1 (Engine)</div>
      <div id="label-game" class="view-label">VIEW 2 (Game)</div>
      <p style="margin-top: 50px; margin-left: 10px">
        FPS: <span id="fps">0</span>
      </p>
    </div>
    <canvas id="glCanvas"></canvas>

    <script id="vertex-shader" type="x-shader/x-vertex">
          #version 300 es

          // Layout locations must match the Mesh class
          in vec3 a_position;
          in vec3 a_normal;
          in vec2 a_uv;

          uniform mat4 u_model;      // Model Matrix (Local -> World)
      uniform mat4 u_view;       // View Matrix (World -> Camera)
      uniform mat4 u_projection; // Projection Matrix

      out vec3 v_normal;
      out vec3 v_fragPos; // World position of the vertex
       out vec2 v_uv;

      void main() {
          vec4 worldPos = u_model * vec4(a_position, 1.0);
          v_fragPos = worldPos.xyz;
          v_normal = mat3(transpose(inverse(u_model))) * a_normal;
          v_uv = a_uv;
          gl_Position = u_projection * u_view * worldPos;
      }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
      #version 300 es
      precision mediump float;

      in vec3 v_fragPos;
      in vec3 v_normal;
      in vec2 v_uv;

      uniform sampler2D u_texture;
      uniform vec3 u_viewPos;

      struct Material {
          float shininess;
      };

      struct DirLight {
          vec3 direction;
          vec3 color;
          float intensity;
      };

      struct PointLight {
          vec3 position;
          vec3 color;
          float intensity;
          float constant;
          float linear;
          float quadratic;
      };

      #define MAX_POINT_LIGHTS 4  // Max lights supported

      uniform Material u_material;
      uniform DirLight u_dirLight;
      // Array of lights
      uniform PointLight u_pointLights[MAX_POINT_LIGHTS];
      uniform int u_numPointLights; // How many are active

      uniform vec3 u_ambientColor;

      out vec4 outColor;

      vec3 CalcDirLight(DirLight light, vec3 normal, vec3 viewDir, vec3 texColor) {
          vec3 lightDir = normalize(-light.direction);
          float diff = max(dot(normal, lightDir), 0.0);

          vec3 halfwayDir = normalize(lightDir + viewDir);
          float spec = pow(max(dot(normal, halfwayDir), 0.0), u_material.shininess);

          vec3 ambient  = u_ambientColor * texColor;
          vec3 diffuse  = light.color * light.intensity * diff * texColor;
          vec3 specular = light.color * light.intensity * spec;

          return (diffuse + specular); // Ambient added only once in main
      }

      vec3 CalcPointLight(PointLight light, vec3 normal, vec3 fragPos, vec3 viewDir, vec3 texColor) {
          vec3 lightDir = normalize(light.position - fragPos);
          float diff = max(dot(normal, lightDir), 0.0);

          vec3 halfwayDir = normalize(lightDir + viewDir);
          float spec = pow(max(dot(normal, halfwayDir), 0.0), u_material.shininess);

          float distance    = length(light.position - fragPos);
          float attenuation = 1.0 / (light.constant + light.linear * distance + light.quadratic * (distance * distance));

          vec3 diffuse  = light.color * light.intensity * diff * texColor;
          vec3 specular = light.color * light.intensity * spec;

          diffuse  *= attenuation;
          specular *= attenuation;

          return (diffuse + specular);
      }

      void main() {
          vec3 norm = normalize(v_normal);
          vec3 viewDir = normalize(u_viewPos - v_fragPos);
          vec3 texColor = vec3(texture(u_texture, v_uv));

          // 1. Ambient (Base)
          vec3 result = u_ambientColor * texColor;

          // 2. Directional Light
          result += CalcDirLight(u_dirLight, norm, viewDir, texColor);

          // 3. Point Lights (Loop)
          for(int i = 0; i < MAX_POINT_LIGHTS; i++) {
              if(i >= u_numPointLights) break;
              result += CalcPointLight(u_pointLights[i], norm, v_fragPos, viewDir, texColor);
          }

          outColor = vec4(result, 1.0);
      }
    </script>

    <script src="webgl-utils.js"></script>
    <script src="mesh.js"></script>
    <script src="primitives.js"></script>
    <script src="obj-loader.js"></script>
    <script src="texture.js"></script>
    <script src="main.js"></script>
  </body>
</html>
